name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the minimum allowed by the "engines" field; 22.x tracks the
        # current LTS.
        node-version: ['20.19', '22.x']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npx vitest run

      # `npm run build` would re-run the type check that already ran above, so
      # this calls the build step on its own.
      - name: Build
        run: npm run build-only
